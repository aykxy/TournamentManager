name: Build standalone staff map veto

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a tested staff release (requires unique version)'
        type: boolean
        default: false
      version:
        description: 'Staff version (e.g. 1.0.0)'
        type: string
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install 'PySide6>=6.7,<7' 'pyinstaller==6.16.0' 'pillow==12.0.0'
      - name: Validate standalone code and map assets
        shell: pwsh
        run: |
          python -m py_compile staff_map_veto.py staff_update.py map_veto.py
          python -m unittest discover -s tests -v
          python -c "from pathlib import Path; names=['barrio','city-hall','little-seoul','mirror-park','morningwood','paleto-v2','sandy','southside']; missing=[str(Path('assets/maps')/n/f) for n in names for f in ['preview.png','spawns.png'] if not (Path('assets/maps')/n/f).is_file()]; assert not missing, 'Missing map assets: '+', '.join(missing)"
      - name: Validate staff release version
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          STAFF_VERSION: ${{ inputs.version }}
        run: |
          python -c "import os,re; from staff_update import VERSION; value=os.environ['STAFF_VERSION']; assert re.fullmatch(r'[0-9]+\\.[0-9]+\\.[0-9]+',value), 'Invalid version'; assert VERSION==value, 'Update staff_update.py VERSION to match release version'"
      - name: Prepare icon and font
        shell: pwsh
        run: |
          python -c "from PIL import Image; image=Image.open('assets/arena_logo.png').convert('RGBA'); image.save('assets/arena_logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/rajdhani/Rajdhani-SemiBold.ttf" -OutFile "assets/Rajdhani-SemiBold.ttf"
      - name: Build portable staff executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name ArenaMapVeto --icon "assets/arena_logo.ico" --add-data "assets/arena_logo.ico;assets" --add-data "assets/Rajdhani-SemiBold.ttf;assets" --add-data "assets/maps;assets/maps" staff_map_veto.py
          $sha=(Get-FileHash "dist/ArenaMapVeto.exe" -Algorithm SHA256).Hash.ToLower()
          "$sha  ArenaMapVeto.exe" | Set-Content -Encoding ascii "dist/ArenaMapVeto.exe.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ArenaMapVeto-Staff-Windows
          path: |
            dist/ArenaMapVeto.exe
            dist/ArenaMapVeto.exe.sha256
      - name: Publish staff release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STAFF_VERSION: ${{ inputs.version }}
        run: |
          gh release create "staff-v$env:STAFF_VERSION" "dist/ArenaMapVeto.exe" "dist/ArenaMapVeto.exe.sha256" --title "Arena Map Veto Staff v$env:STAFF_VERSION" --notes "Standalone staff Map Veto. Map images bundled; saved veto data preserved." --latest=false
