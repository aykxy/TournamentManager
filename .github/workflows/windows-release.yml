name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows application
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ArenaTournamentManager --add-data "assets/arena_logo.png;assets" --collect-all PySide6.QtWebEngineWidgets main.py
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ArenaTournamentManager/*" -DestinationPath "ArenaTournamentManager-Windows.zip"
          (Get-FileHash "ArenaTournamentManager-Windows.zip" -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "ArenaTournamentManager-Windows.zip.sha256"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaTournamentManager-Windows
          path: |
            ArenaTournamentManager-Windows.zip
            ArenaTournamentManager-Windows.zip.sha256
      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" "ArenaTournamentManager-Windows.zip" "ArenaTournamentManager-Windows.zip.sha256" --clobber
