name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Check Python source
        shell: pwsh
        run: python -m py_compile main.py map_veto.py updater.py
      - name: Run automated tests
        shell: pwsh
        run: |
          if (-not (Test-Path tests)) { throw 'Missing tests/ directory: upload the tests before building.' }
          python -m unittest discover -s tests -v
      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; image=Image.open('assets/arena_logo.png').convert('RGBA'); image.save('assets/arena_logo.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Prepare licensed UI font
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/rajdhani/Rajdhani-SemiBold.ttf" -OutFile "assets/Rajdhani-SemiBold.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/rajdhani/OFL.txt" -OutFile "assets/Rajdhani-OFL.txt"
          if ((Get-Item "assets/Rajdhani-SemiBold.ttf").Length -lt 10000) { throw 'UI font download failed' }
      - name: Build Arena Tournament Manager
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name ArenaTournamentManager --icon "assets/arena_logo.ico" --add-data "assets/arena_logo.png;assets" --add-data "assets/arena_logo.ico;assets" --add-data "assets/Rajdhani-SemiBold.ttf;assets" --add-data "assets/Rajdhani-OFL.txt;assets" --collect-all PySide6.QtWebEngineWidgets --hidden-import updater --hidden-import notifications --hidden-import backup_manager --hidden-import team_reconciliation --hidden-import map_veto --hidden-import overview_logic main.py
      - name: Build standalone updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name ArenaUpdater updater.py
          Copy-Item dist/ArenaUpdater.exe dist/ArenaTournamentManager/ArenaUpdater.exe
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ArenaTournamentManager/*" -DestinationPath "ArenaTournamentManager-Windows.zip"
          $sha=(Get-FileHash "ArenaTournamentManager-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  ArenaTournamentManager-Windows.zip" | Set-Content -Encoding ascii "ArenaTournamentManager-Windows.zip.sha256"
      - name: Upload build for testing
        uses: actions/upload-artifact@v6
        with:
          name: ArenaTournamentManager-Windows
          path: |
            ArenaTournamentManager-Windows.zip
            ArenaTournamentManager-Windows.zip.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes }
          gh release upload "${{ github.ref_name }}" "ArenaTournamentManager-Windows.zip" "ArenaTournamentManager-Windows.zip.sha256" --clobber
